# Initial test set for the agentic CLARA replication.
#
# Selected from the 78 terms flagged `has_all_references: true` in
# agentic-pipeline-testdata/data/cells_data.json (retrievable open-source
# references). Full term content (definition, references, relations) is
# authoritative in cells_data.json — this file only lists IDs and selection
# metadata so the extractor stays a single source of truth.
#
# Selection criteria:
#   - spread across reference counts (1..5)
#   - spread across definition length (55..2067 chars)
#   - domain diversity (epithelial, endothelial, immune, neural, muscle,
#     fibroblast, exocrine, ependymal)
#   - include near-sibling groups for specificity testing

source: agentic-pipeline-testdata/data/cells_data.json
selection_date: 2026-04-19
